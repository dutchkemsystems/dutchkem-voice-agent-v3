# Render Blueprint — dutchkem-voice-agent-v3
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API ────────────────────────────────────────
  - name: dutchkem-backend
    type: web
    plan: free
    runtime: python
    buildCommand: pip install -r requirements/production.txt
    startCommand: gunicorn config.app:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT --access-logfile - --error-logfile -
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./dutchkem.db
      - key: MONGODB_URL
        value: mongodb://localhost:27017/dutchkem_voice
      - key: REDIS_URL
        value: rediss://default:YOUR_REDIS_PASSWORD@YOUR_REDIS_HOST:6379
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://dutchkem-frontend.vercel.app"]'
    healthCheckPath: /health
    autoDeploy: true
